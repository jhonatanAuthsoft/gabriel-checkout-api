name: Deploy gabriel-checkout-api

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: [self-hosted]

    steps:
      - name: "Debug: verificar caminho e permissões"
        run: |
          whoami
          pwd
          ls -la /home/authsoft/Documentos/gabriel-checkout
          ls -la /home/authsoft/Documentos/gabriel-checkout/gabriel-checkout-api

      - name: Atualiza repositório ETA-BACK localmente
        run: |
          cd /home/authsoft/Documentos/gabriel-checkout/gabriel-checkout-api
          git pull origin staging

      - name: Rebuild e restart containers
        run: |
          cd /home/authsoft/Documentos/gabriel-checkout
          docker compose build backend
          docker compose up -d
